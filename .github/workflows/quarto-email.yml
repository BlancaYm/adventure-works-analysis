name: Ejecutar Quarto y enviar email

on:
  schedule:
    - cron: '0 9 * * 1'  # Cada lunes a las 9 AM
  workflow_dispatch:  # También puedes ejecutarlo manualmente

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Instalar R
        uses: r-lib/setup-r@v2
      
      - name: Enviar email con HTML
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📊 Informe Adventure Works - Semanal"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Hola,
            
            Se adjunta el informe automatizado de Adventure Works.
            
            Fecha: $(date)
            
            Saludos,
            Sistema de automatización
          attachments: Adventure_Works.html
