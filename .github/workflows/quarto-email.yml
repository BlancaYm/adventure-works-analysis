name: Ejecutar Quarto y enviar email

on:
  schedule:
    - cron: '0 9 * * 1'  # Cada lunes a las 9 AM
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-base-dev
      
      - name: Instalar dependencias R
        run: |
          Rscript -e "install.packages(c('readxl', 'dplyr', 'ggplot2', 'forecast', 'factoextra', 'corrplot', 'lubridate'))"
      
      - name: Instalar Quarto
        run: |
          sudo apt-get install -y curl
          curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v1.3.450/quarto-1.3.450-linux-amd64.deb
          sudo dpkg -i quarto-1.3.450-linux-amd64.deb
      
      - name: Renderizar Quarto a HTML
        run: quarto render Adventure_Works.qmd --to html
      
      - name: Enviar email con HTML
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📊 Informe Adventure Works - Semanal"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Hola,
            
            Se adjunta el informe automatizado de Adventure Works.
            
            Generado automáticamente cada lunes.
            
            Saludos,
            Sistema de automatización
          attachments: Adventure_Works.html
