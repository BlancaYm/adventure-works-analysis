name: Ejecutar Quarto y enviar email

on:
  schedule:
    - cron: '0 9 * * 1'  # Cada lunes a las 9 AM
  workflow_dispatch:  # También puedes ejecutarlo manualmente

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Instalar R
        uses: r-lib/setup-r@v2
      
      - name: Instalar dependencias R
        run: |
          install.packages(c("readxl", "dplyr", "ggplot2", "forecast", "factoextra", "corrplot", "lubridate"))
        shell: Rscript {0}
      
      - name: Instalar Quarto
        uses: quarto-dev/setup-quarto@v2
      
      - name: Renderizar Quarto a HTML
        run: quarto render Adventure_Works.qmd --to html
      
      - name: Enviar email con HTML
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Informe Adventure Works - Semanal"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Hola,
            
            Se adjunta el informe automatizado de Adventure Works.
            
            Fecha: $(date)
            
            Saludos,
            Sistema de automatización
          attachments: Adventure_Works.html
